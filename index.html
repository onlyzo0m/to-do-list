<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تطبيق قائمة المهام - نظم يومك بسهولة وأناقة">
    <title>قائمة المهام | To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <h1>قائمة المهام</h1>
                </div>
                <div class="header-stats">
                    <div class="stat-badge" id="stat-total">
                        <span class="stat-number">0</span>
                        <span class="stat-label">الكل</span>
                    </div>
                    <div class="stat-badge stat-done" id="stat-done">
                        <span class="stat-number">0</span>
                        <span class="stat-label">مكتمل</span>
                    </div>
                    <div class="stat-badge stat-pending" id="stat-pending">
                        <span class="stat-number">0</span>
                        <span class="stat-label">متبقي</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Add Task Section -->
        <section class="add-task-section">
            <form id="task-form" class="task-form">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="task-input" 
                        class="task-input" 
                        placeholder="اكتب مهمة جديدة..." 
                        autocomplete="off"
                        required
                    >
                    <select id="priority-select" class="priority-select">
                        <option value="low">عادي</option>
                        <option value="medium" selected>متوسط</option>
                        <option value="high">مهم</option>
                    </select>
                </div>
                <button type="submit" id="add-btn" class="add-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>إضافة</span>
                </button>
            </form>
        </section>

        <!-- Filter Tabs -->
        <section class="filter-section">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" id="filter-all">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                    </svg>
                    الكل
                </button>
                <button class="filter-tab" data-filter="pending" id="filter-pending">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    قيد التنفيذ
                </button>
                <button class="filter-tab" data-filter="completed" id="filter-completed">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    مكتمل
                </button>
            </div>
            <button class="clear-completed-btn" id="clear-completed-btn" title="حذف المكتمل">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                حذف المكتمل
            </button>
        </section>

        <!-- Progress Bar -->
        <section class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-text" id="progress-text">0% مكتمل</span>
        </section>

        <!-- Tasks List -->
        <section class="tasks-section">
            <ul id="tasks-list" class="tasks-list">
                <!-- Tasks will be injected here -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                </div>
                <h3>لا توجد مهام بعد</h3>
                <p>ابدأ بإضافة مهمتك الأولى!</p>
            </div>
        </section>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
